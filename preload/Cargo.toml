[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Pinned Reverie rev: 02973cdcfcadd21190fda864dfa9eb1b3e6ed1c1 (integration/literoot-sprint).
[features]
default = ["liteinst"]
liteinst = ["dep:reverie-liteinst"]
# Trap-only in-guest via Reverie's TrapHost API: no reverie-ptrace
# and no reverie-liteinst. default-features=false keeps
# reverie-inguest's own preload-constructor out (this crate has its
# own .init_array entry).
inguest-trap = ["dep:reverie-inguest"]
# Compile-time B4 step-3 successor consumer seam (no entry point
# constructs it yet): pulls the native-exec injection surface so
# RootfsSuccessorConsumer type-checks against the real trait.
successor = [
    "liteinst",
    "dep:reverie-inguest",
    "dep:reverie-rpc-transport",
    "reverie-liteinst/exec-native-injection",
    "reverie-inguest/exec-native-injection",
]
# Mapped successor consumer (E2-3c slice 4): the mapped-musl
# successor initializer on top of the successor seam. The
# physical mapped entry and host harness select this feature
# for the private successor image only.
mapped-successor = [
    "successor",
    "reverie-liteinst/loader-private-runtime",
    "reverie-inguest/loader-private-runtime",
]

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "02973cdcfcadd21190fda864dfa9eb1b3e6ed1c1" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "02973cdcfcadd21190fda864dfa9eb1b3e6ed1c1", default-features = false, features = ["liteinst"], optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "02973cdcfcadd21190fda864dfa9eb1b3e6ed1c1", default-features = false, features = ["launcher", "coordinator-rpc", "rcb-clock"], optional = true }
reverie-rpc-transport = { git = "https://github.com/rrnewton/reverie", rev = "02973cdcfcadd21190fda864dfa9eb1b3e6ed1c1", optional = true }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }





[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
