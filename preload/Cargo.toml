[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Pinned Reverie rev: 9013ab74153d30d023cd648928bf10c1d15bd716 (musearm1/arm-trap-pin-20261107).
[features]
default = ["liteinst"]
liteinst = ["dep:reverie-liteinst"]
# Trap-only in-guest via Reverie's TrapHost API: no reverie-ptrace
# and no reverie-liteinst. default-features=false keeps
# reverie-inguest's own preload-constructor out (this crate has its
# own .init_array entry).
inguest-trap = ["dep:reverie-inguest"]

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "9013ab74153d30d023cd648928bf10c1d15bd716" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "9013ab74153d30d023cd648928bf10c1d15bd716", default-features = false, optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "9013ab74153d30d023cd648928bf10c1d15bd716", default-features = false, features = ["launcher", "coordinator-rpc", "rcb-clock"], optional = true }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }





[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
