[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Pinned Reverie rev: 52fcfde386bdec275bd3d23a2ceaa1b1e7c59977 (Reverie main).
[features]
default = ["liteinst"]
liteinst = ["dep:reverie-liteinst"]
# Trap-only in-guest via Reverie's TrapHost API: no reverie-ptrace
# and no reverie-liteinst. default-features=false keeps
# reverie-inguest's own preload-constructor out (this crate has its
# own .init_array entry).
inguest-trap = ["dep:reverie-inguest"]
# Compile-time B4 step-3 successor consumer seam (no entry point
# constructs it yet): pulls the native-exec injection surface so
# RootfsSuccessorConsumer type-checks against the real trait.
successor = [
    "liteinst",
    "exec-stage",
    "dep:reverie-inguest",
    "reverie-liteinst/exec-native-injection",
    "reverie-inguest/exec-native-injection",
]
# The mapped route's staging client (src/exec_stage.rs): the image stages its
# exec snapshot with the host's birth authority before it injects exec. It
# needs only the RPC transport, so a TrapHost build can stage without
# `successor`, which brings in reverie-liteinst and its global allocator.
exec-stage = ["dep:reverie-rpc-transport"]
# Mapped successor consumer (E2-3c slice 4): the mapped-musl
# successor initializer on top of the successor seam. The
# physical mapped entry and host harness select this feature
# for the private successor image only.
mapped-successor = [
    "successor",
    "reverie-liteinst/loader-private-runtime",
    "reverie-inguest/loader-private-runtime",
    "dep:sha2",
]
# Mapped first image (initial generation): later work. Enabling it fails
# to compile by name (src/lib.rs) until Reverie's factory defines literoot's
# first generation; scripts/check-mapped-initial-refusal.sh pins that. So
# `cargo ... --all-features` on this crate fails by design: that is the refusal,
# not breakage.
mapped-initial = ["mapped-successor"]
# The private successor image's own build: `mapped-successor` plus Reverie's
# `private-libc-exports`, which exports the private runtime's C allocator
# (malloc and its aliases) and its strong __init_tls under their libc names.
# Reverie's factory builds exactly ["mapped-successor-image"]
# (selected_initializers.rs, LITEROOT). literoot's own musl tests and checks
# build `mapped-successor` alone: an ordinary musl program that links those
# exports dies before main.
mapped-successor-image = ["mapped-successor", "reverie-inguest/private-libc-exports"]
# Watched exec (W6a spawn swap): allows this preload build to
# arm TrapOptions.exec_watch when the launcher asserted watched
# mode in the tool selector. Default off; an asserted watched
# launch against a preload without this feature is refused by
# name (see rootfs_tool::exec_watch_for_selector).
exec-watch = []
# The watched first image of a mapped launch: a TrapHost preload that arms the
# exec watch and stages its snapshot, with no reverie-liteinst in the graph.
# Build it with --no-default-features. src/lib.rs refuses, by name, the two
# combinations that would put a second global allocator in it.
watched-initial = ["inguest-trap", "exec-watch", "exec-stage"]

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "52fcfde386bdec275bd3d23a2ceaa1b1e7c59977" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "52fcfde386bdec275bd3d23a2ceaa1b1e7c59977", default-features = false, features = ["liteinst"], optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "52fcfde386bdec275bd3d23a2ceaa1b1e7c59977", default-features = false, features = ["launcher", "coordinator-rpc", "rcb-clock"], optional = true }
reverie-rpc-transport = { git = "https://github.com/rrnewton/reverie", rev = "52fcfde386bdec275bd3d23a2ceaa1b1e7c59977", optional = true }
libc = "0.2.186"
# The initial-image packet's config wire fingerprint (src/initial_packet.rs).
sha2 = { version = "0.10.9", optional = true }
serde = { version = "1.0.219", features = ["derive"] }





# The profile Reverie's private-image factory builds the image archive with:
# release code generation (opt-level 3, no debug info) with debug assertions and
# overflow checks on, and no LTO. The factory requires exactly these values in
# the compiler-artifact profile; private-static/dry-run.sh builds with this
# profile and checks them.
[profile.liteinst-runtime]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false

[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
