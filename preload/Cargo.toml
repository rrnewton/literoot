[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Slot-local path pins (design docs/design.md §10): reverie git
# ac71ee9c844def23714c22f0a37f92bb1e838817.
[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/facebookexperimental/reverie", rev = "ac71ee9c844def23714c22f0a37f92bb1e838817" }
reverie-liteinst = { git = "https://github.com/facebookexperimental/reverie", rev = "ac71ee9c844def23714c22f0a37f92bb1e838817", default-features = false }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }
