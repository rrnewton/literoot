[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Pinned Reverie rev: ac8b35c226e87fd3c34d25d4cd9e9fb475e73904 (Reverie main).
[features]
default = ["liteinst"]
liteinst = ["dep:reverie-liteinst"]
# Trap-only in-guest via Reverie's TrapHost API: no reverie-ptrace
# and no reverie-liteinst. default-features=false keeps
# reverie-inguest's own preload-constructor out (this crate has its
# own .init_array entry).
inguest-trap = ["dep:reverie-inguest"]
# Compile-time B4 step-3 successor consumer seam (no entry point
# constructs it yet): pulls the native-exec injection surface so
# RootfsSuccessorConsumer type-checks against the real trait.
successor = [
    "liteinst",
    "dep:reverie-inguest",
    "dep:reverie-rpc-transport",
    "reverie-liteinst/exec-native-injection",
    "reverie-inguest/exec-native-injection",
]
# Mapped successor consumer (E2-3c slice 4): the mapped-musl
# successor initializer on top of the successor seam. The
# physical mapped entry and host harness select this feature
# for the private successor image only.
mapped-successor = [
    "successor",
    "reverie-liteinst/loader-private-runtime",
    "reverie-inguest/loader-private-runtime",
    "dep:sha2",
]
# Mapped first image (initial generation): dh-tc7os work. Enabling it fails
# to compile by name (src/lib.rs) until Reverie's factory defines literoot's
# first generation; scripts/check-mapped-initial-refusal.sh pins that. So
# `cargo ... --all-features` on this crate fails by design: that is the refusal,
# not breakage. Reverie's factory passes exactly ["mapped-successor"].
mapped-initial = ["mapped-successor"]
# Watched exec (W6a spawn swap): allows this preload build to
# arm TrapOptions.exec_watch when the launcher asserted watched
# mode in the tool selector. Default off; an asserted watched
# launch against a preload without this feature is refused by
# name (see rootfs_tool::exec_watch_for_selector).
exec-watch = []

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "ac8b35c226e87fd3c34d25d4cd9e9fb475e73904" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "ac8b35c226e87fd3c34d25d4cd9e9fb475e73904", default-features = false, features = ["liteinst"], optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "ac8b35c226e87fd3c34d25d4cd9e9fb475e73904", default-features = false, features = ["launcher", "coordinator-rpc", "rcb-clock"], optional = true }
reverie-rpc-transport = { git = "https://github.com/rrnewton/reverie", rev = "ac8b35c226e87fd3c34d25d4cd9e9fb475e73904", optional = true }
libc = "0.2.186"
# The initial-image packet's config wire fingerprint (src/initial_packet.rs).
sha2 = { version = "0.10.9", optional = true }
serde = { version = "1.0.219", features = ["derive"] }





[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
