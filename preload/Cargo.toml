[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Slot-local path pins (design docs/design.md §10): reverie git
# 778a446cd3283ecd1c220792071a84b27c14db56.
[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/facebookexperimental/reverie", rev = "778a446cd3283ecd1c220792071a84b27c14db56" }
reverie-liteinst = { git = "https://github.com/facebookexperimental/reverie", rev = "778a446cd3283ecd1c220792071a84b27c14db56", default-features = false }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }




