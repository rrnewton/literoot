[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Slot-local path pins (design docs/design.md §10): reverie git
# 15d17486ff2698c5ca2a4294fc5f8af3f6b51ee4.
[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "15d17486ff2698c5ca2a4294fc5f8af3f6b51ee4" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "15d17486ff2698c5ca2a4294fc5f8af3f6b51ee4", default-features = false, features = ["liteinst"] }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }





[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }
