[package]
name = "literoot-preload"
version = "0.0.1"
edition = "2021"
publish = false
description = "In-guest preload hosting the literoot RootfsTool (Reverie liteinst backend)."

[lib]
name = "literoot_preload"
crate-type = ["cdylib"]

# Pinned Reverie rev: d8527112bbdd59ac83892f69e2e29656e1401ef7 (musearm1/arm-trap-pin-20261107).
[features]
default = ["liteinst"]
liteinst = ["dep:reverie-liteinst"]
# Trap-only in-guest via Reverie's TrapHost API: no reverie-ptrace
# and no reverie-liteinst. default-features=false keeps
# reverie-inguest's own preload-constructor out (this crate has its
# own .init_array entry).
inguest-trap = ["dep:reverie-inguest"]
# Compile-time B4 step-3 successor consumer seam (no entry point
# constructs it yet): pulls the native-exec injection surface so
# RootfsSuccessorConsumer type-checks against the real trait.
successor = [
    "liteinst",
    "dep:reverie-inguest",
    "dep:reverie-rpc-transport",
    "reverie-liteinst/exec-native-injection",
    "reverie-inguest/exec-native-injection",
]

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726" }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", default-features = false, features = ["liteinst"], optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", default-features = false, features = ["launcher", "coordinator-rpc", "rcb-clock"], optional = true }
reverie-rpc-transport = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", optional = true }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }





[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
