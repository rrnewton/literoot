[package]
name = "literoot"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Fast drop-in proot replacement: unprivileged rootfs execution with in-guest syscall interception (early development)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rrnewton/literoot"
homepage = "https://github.com/rrnewton/literoot"
authors = ["Hermit/Reverie contributors"]
readme = "README.md"
keywords = ["proot", "rootfs", "container", "instrumentation", "linux"]
categories = ["command-line-utilities", "os::linux-apis", "virtualization"]

[[bin]]
name = "literoot"
path = "src/main.rs"

[features]
# `run` wires the Reverie Tool (ptrace reference backend for the M1
# POC). The crates.io 0.0.1 placeholder is published from the
# placeholder commit (no dependencies); POC pins below are git revs
# (design docs/design.md §10) expressed as local path deps in the
# dev-hermit slot so the POC builds offline:
#   reverie  git d8527112bbdd59ac83892f69e2e29656e1401ef7
#   liteinst crates.io 0.2.0 (via reverie-liteinst)
# Flip each edge to a crates.io version as releases land.
default = ["run", "in-guest"]
# `tool` is the backend-neutral RootfsTool + launcher scaffolding.
tool = ["dep:reverie", "dep:libc", "dep:serde", "dep:tokio"]
# `run` alone is the ptrace-only build: no in-guest backend crates
# (reverie-liteinst / reverie-inguest / liteinst) are compiled, so it
# builds on architectures the in-guest stack does not serve yet.
run = ["tool", "dep:reverie-ptrace"]
in-guest = ["dep:reverie-liteinst"]
# Trap-only in-guest: Reverie's TrapHost API, zero ptrace, and no
# reverie-ptrace or reverie-liteinst anywhere in the graph.
inguest-trap = ["tool", "dep:reverie-inguest"]
ptrace-only = ["run"]

[dependencies]
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", optional = true }
reverie-ptrace = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", optional = true }
reverie-liteinst = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", default-features = false, features = ["liteinst"], optional = true }
reverie-inguest = { git = "https://github.com/rrnewton/reverie", rev = "5c0f2bf192a5b3f891fd39bc12a61d368dafd726", default-features = false, features = ["launcher", "coordinator-rpc"], optional = true }
libc = { version = "0.2.186", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
tokio = { version = "1.52.4", features = ["rt", "macros"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1


[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }

[workspace]
